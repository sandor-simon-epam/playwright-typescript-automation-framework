name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write
  checks: write
  pull-requests: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Restore Allure history
        uses: actions/cache@v4
        with:
          path: allure-report/history
          key: allure-history-${{ github.ref }}
          restore-keys: |
            allure-history-
      - name: Lint code
        run: npx eslint .
      - name: Format check
        run: npx prettier --check .
      - name: Run Playwright tests
        run: npx playwright test
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          files: test-results/junit.xml
          check_name: Playwright Test Results
      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: |
          mkdir -p allure-report/history
          npx allure@latest generate allure-results -o allure-report
      - name: Verify Allure report generated
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f allure-report/index.html ]; then
            echo "Warning: Allure report index.html not found"
            echo "Directory contents:"
            ls -la allure-report/ || true
          else
            echo "✓ Allure report generated successfully"
          fi
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
      - name: Upload Allure report to Pages
        uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: allure-report/

  deploy:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
